name: Build Legacy of Goku Maker Engine (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Download repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # 3. Install dependencies
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame==2.6.1 numpy pyinstaller

      # 4. Confirm packages are installed
      - name: Verify Python dependencies
        shell: pwsh
        run: |
          python -m pip --version
          python -m pip show pygame
          python -m pip show numpy
          python -c "import pygame; print('Pygame:', pygame.version.ver)"
          python -c "import numpy; print('NumPy:', numpy.__version__)"

      # 5. Verify project imports
      - name: Verify game engine
        shell: pwsh
        run: |
          python -c "from core.game import Game; print('Game engine import OK')"

      # 6. Build Windows application
      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onedir `
            --console `
            --name LegacyOfGokuMaker `
            --icon icon.ico `
            --collect-all pygame `
            --collect-all numpy `
            --hidden-import pygame `
            --add-data "assets;assets" `
            --add-data "attacks;attacks" `
            --add-data "config;config" `
            --add-data "core;core" `
            --add-data "data;data" `
            --add-data "dev_tools;dev_tools" `
            --add-data "entities;entities" `
            --add-data "objects;objects" `
            --add-data "rooms;rooms" `
            --add-data "ui;ui" `
            main.py

      # 7. Upload Windows application
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: LegacyOfGokuMaker-Windows
          path: dist/LegacyOfGokuMaker/

