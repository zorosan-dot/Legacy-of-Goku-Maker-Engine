name: Build Legacy of Goku Maker Engine (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Verify dependencies
        run: |
          python -c "import pygame; print('Pygame:', pygame.version.ver)"
          python -c "import numpy; print('NumPy:', numpy.__version__)"
          python -c "from core.game import Game; print('Game import OK')"

      - name: Build Windows application
        shell: pwsh
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onedir `
            --console `
            --name LegacyOfGokuMaker `
            --icon icon.ico `
            --collect-all pygame `
            --collect-all numpy `
            --hidden-import pygame `
            --add-data "assets;assets" `
            --add-data "attacks;attacks" `
            --add-data "config;config" `
            --add-data "core;core" `
            --add-data "data;data" `
            --add-data "dev_tools;dev_tools" `
            --add-data "entities;entities" `
            --add-data "objects;objects" `
            --add-data "rooms;rooms" `
            --add-data "ui;ui" `
            main.py

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: LegacyOfGokuMaker-Windows
          path: dist/LegacyOfGokuMaker/

