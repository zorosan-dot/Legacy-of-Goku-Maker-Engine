name: Build Legacy of Goku Maker Engine (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pygame

      - name: Verify imports
        run: |
          python -c "import pygame; print('pygame OK')"
          python -m PyInstaller --version

      - name: Build Windows application
        run: |
          python -m PyInstaller --clean --noconfirm --onedir --windowed --name LegacyOfGokuMaker --icon=icon.ico --add-data "assets;assets" --add-data "attacks;attacks" --add-data "config;config" --add-data "core;core" --add-data "data;data" --add-data "entities;entities" --add-data "objects;objects" --add-data "rooms;rooms" --add-data "ui;ui" --collect-all pygame main.py

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: LegacyOfGokuMaker-Windows
          path: dist/LegacyOfGokuMaker/
